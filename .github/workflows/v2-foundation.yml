name: v0.2.0 foundation

on:
  push:
    branches:
      - v0.2.0
    paths:
      - 'designer-v2/**'
      - 'docs/V0.2.0-ARCHITECTURE.md'
      - 'THIRD_PARTY_LICENSES/**'
      - '.github/workflows/v2-foundation.yml'
  workflow_dispatch:

jobs:
  project-model-and-cli:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sample project
        shell: pwsh
        run: node designer-v2/cli/125a-gui.js validate designer-v2/examples/knob-dark-metal.125agui.json
      - name: Run CLI self-test
        shell: pwsh
        run: node designer-v2/cli/selftest.js
      - name: Run shared renderer-adapter self-test
        shell: pwsh
        run: node designer-v2/core/selftest.js

  simple-mode-web:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Simple Mode dependencies
        working-directory: designer-v2/web
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Build Simple Mode
        working-directory: designer-v2/web
        shell: pwsh
        run: npm run build
      - name: Upload Simple Mode build
        uses: actions/upload-artifact@v4
        with:
          name: 125A-GUI-Designer-v0.2.0-SimpleMode-Web
          path: designer-v2/web/dist
