name: Publish Generated Assets

on:
  workflow_dispatch:
  push:
    branches:
      - v0.1.0
    paths:
      - "src/**"
      - "!src/GuiApp.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/publish-mixengine-assets.yml"

permissions:
  contents: write

jobs:
  publish-assets:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: v0.1.0
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Render all assets
        shell: pwsh
        run: |
          .\build\Release\125A_Knob_Designer.exe exports

      - name: Categorize generated assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path published\mixengine\knobs | Out-Null
          New-Item -ItemType Directory -Force -Path published\mixengine\hardware | Out-Null
          New-Item -ItemType Directory -Force -Path published\mixengine\faders | Out-Null
          New-Item -ItemType Directory -Force -Path published\mixengine\meters | Out-Null
          New-Item -ItemType Directory -Force -Path published\general\knobs | Out-Null

          Get-ChildItem exports -Filter "125A_MixEngine_Analog_*.png" |
            Copy-Item -Destination published\mixengine\knobs

          Get-ChildItem exports -Filter "125A_MixEngine_LED_*.png" |
            Copy-Item -Destination published\mixengine\hardware
          Get-ChildItem exports -Filter "125A_MixEngine_Push_Button_*.png" |
            Copy-Item -Destination published\mixengine\hardware
          Get-ChildItem exports -Filter "125A_MixEngine_Toggle_*.png" |
            Copy-Item -Destination published\mixengine\hardware
          Get-ChildItem exports -Filter "125A_MixEngine_Rocker_*.png" |
            Copy-Item -Destination published\mixengine\hardware

          Get-ChildItem exports -Filter "125A_MixEngine_Fader_*.png" |
            Copy-Item -Destination published\mixengine\faders

          Get-ChildItem exports -Filter "125A_MixEngine_VU_Meter_*.png" |
            Copy-Item -Destination published\mixengine\meters

          Get-ChildItem exports -Filter *.png |
            Where-Object { $_.Name -notlike "125A_MixEngine_*" } |
            Copy-Item -Destination published\general\knobs

          $all = Get-ChildItem published -Recurse -Filter *.png
          if ($all.Count -ne 60) {
            throw "Expected 60 categorized PNG assets, found $($all.Count)."
          }

      - name: Publish generated asset branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan generated-assets-v0.1.0
          git rm -rf . 2>$null

          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item published\* assets\ -Recurse

          @"
          # 125A Generated Assets

          Generated automatically from `v0.1.0`.

          - `assets/mixengine/knobs/` — MixEngine Analog S/M/L
          - `assets/mixengine/hardware/` — LEDs, button, toggle, rocker
          - `assets/mixengine/faders/` — MixEngine fader filmstrips
          - `assets/mixengine/meters/` — MixEngine analog VU meter filmstrips
          - `assets/general/knobs/` — reusable general knob families

          Multi-resolution assets are generated at 1x / 1.5x / 2x / 3x.

          Do not edit generated PNGs manually. Change the renderer or preset and regenerate.
          "@ | Set-Content -Encoding UTF8 README.md

          git add README.md assets
          git commit -m "Publish generated GUI assets"
          git push --force origin generated-assets-v0.1.0
