name: Windows v0.1.0 QA

on:
  push:
    branches:
      - v0.1.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Render reference filmstrips
        run: .\build\Release\125A_Knob_Designer.exe exports

      - name: Verify exports
        shell: pwsh
        run: |
          $files = Get-ChildItem exports -Filter *.png
          if ($files.Count -ne 60) {
            throw "Expected 60 PNG filmstrips (32 knobs + 20 hardware + 4 faders + 4 meters), found $($files.Count)."
          }

          function Read-PngSize([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 24) {
              throw "PNG too small: $Path"
            }
            if ($bytes[0] -ne 0x89 -or
                $bytes[1] -ne 0x50 -or
                $bytes[2] -ne 0x4E -or
                $bytes[3] -ne 0x47) {
              throw "Invalid PNG signature: $Path"
            }

            $width =
              ($bytes[16] -shl 24) -bor
              ($bytes[17] -shl 16) -bor
              ($bytes[18] -shl 8) -bor
              $bytes[19]

            $height =
              ($bytes[20] -shl 24) -bor
              ($bytes[21] -shl 16) -bor
              ($bytes[22] -shl 8) -bor
              $bytes[23]

            return @($width, $height)
          }

          foreach ($file in $files) {
            if ($file.Length -le 0) {
              throw "Empty export: $($file.Name)"
            }

            $size = Read-PngSize $file.FullName
            $width = $size[0]
            $height = $size[1]

            if ($file.Name -match '^.+_(\d+)x(\d+)px_\d+pct_(\d+)f\.png$') {
              $cellW = [int]$Matches[1]
              $cellH = [int]$Matches[2]
              $frames = [int]$Matches[3]
              if ($width -ne $cellW -or
                  $height -ne ($cellH * $frames)) {
                throw "Bad rectangular filmstrip geometry: $($file.Name)"
              }
            }
            elseif ($file.Name -match '^.+_(\d+)px_\d+pct_(\d+)f\.png$') {
              $cell = [int]$Matches[1]
              $frames = [int]$Matches[2]
              if ($width -ne $cell -or
                  $height -ne ($cell * $frames)) {
                throw "Bad knob geometry: $($file.Name)"
              }
            }
            elseif ($file.Name -match '^.+_(\d+)px_\d+pct_(\d+)states\.png$') {
              $cell = [int]$Matches[1]
              $states = [int]$Matches[2]
              if ($width -ne $cell -or
                  $height -ne ($cell * $states)) {
                throw "Bad hardware geometry: $($file.Name)"
              }
            }
            else {
              throw "Unexpected export filename format: $($file.Name)"
            }

            Write-Host "$($file.Name) - $($file.Length) bytes - $width x $height"
          }

      - name: Upload executable and filmstrips
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Knob-Designer-v0.1.0-preview
          path: |
            build/Release/125A_Knob_Designer.exe
            build/Release/125A_GUI_Asset_Designer.exe
            exports/*.png
          if-no-files-found: error
